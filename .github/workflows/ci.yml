name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build (web + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" --filter @tallywork/web typecheck
      # Quality gates (docs/QUALITY_GATES.md): every test file belongs to one gate, and Gate 1 runs
      # first so a business-correctness failure is named as such. Desktop tests run in the desktop job.
      - name: Quality gates · every test file is in one gate
        run: node scripts/quality-gates.mjs check
      - name: Gate 1 · business correctness (critical) · unit, API, RLS
        run: node scripts/quality-gates.mjs run 1 --unit --exclude=apps/desktop
      - name: Gate 2 · product functionality (high) · unit, API
        if: ${{ !cancelled() }}
        run: node scripts/quality-gates.mjs run 2 --unit --exclude=apps/desktop
      - name: Gate 3 · product quality (standard) · unit, API
        if: ${{ !cancelled() }}
        run: node scripts/quality-gates.mjs run 3 --unit --exclude=apps/desktop
      # Load smoke on its own (no competing test files): 20 agents, ingest p95 under 500 ms.
      - run: pnpm --filter @tallywork/api exec vitest run test/ops.test.ts -t "load smoke"
        env:
          LOAD_SMOKE: "1"
      # Dashboard latency budget on its own too: admin widgets p95 under 300 ms with 10x demo data.
      - run: pnpm --filter @tallywork/api exec vitest run test/dashboard.test.ts -t "latency"
        env:
          LOAD_SMOKE: "1"
      - run: pnpm --filter @tallywork/web build
        env:
          APP_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      # Performance budget: first-load JavaScript per route (gzip) must stay under 250 KB.
      - run: node apps/web/scripts/check-bundle-budget.mjs

  postgres:
    # Tests run on PGlite; this applies every migration (and the RLS, app role and audit
    # functions) to a real PostgreSQL, twice, to prove they work there and are re-runnable.
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - name: The app role cannot rewrite the audit log
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "begin; set local role tallywork_app; update audit_logs set action = action where false; rollback;" && exit 1 || echo "update refused as expected"

  desktop:
    name: Desktop agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tallywork/desktop typecheck
      - run: pnpm --filter @tallywork/desktop test
      - run: pnpm --filter @tallywork/desktop build
      # Signed installers: set CSC_LINK/CSC_KEY_PASSWORD (Windows/macOS) and APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID (notarization),
      # then run `pnpm --filter @tallywork/desktop dist` on tagged releases.

  e2e:
    # Browser tests against an isolated server (fresh in-memory database, no external services).
    # See e2e/README.md. On failure, the HTML report, traces, screenshots and videos are uploaded.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tallywork/e2e typecheck
      - run: pnpm --filter @tallywork/e2e exec playwright install --with-deps chromium
      # The real Electron app needs a desktop session and an OS keychain: it runs in e2e-electron (Windows).
      # One step per quality gate; Gates 2 and 3 still run (and report) when Gate 1 fails, reusing the
      # build the first step made. Each gate keeps its own report and traces (a run clears its folder).
      - name: Gate 1 · business correctness (critical) · E2E
        run: node scripts/quality-gates.mjs run 1 --e2e -- --project=web --project=desktop --output=test-results/gate-1
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/gate-1
      - name: Gate 2 · product functionality (high) · E2E
        if: ${{ !cancelled() }}
        run: node scripts/quality-gates.mjs run 2 --e2e -- --project=web --project=desktop --output=test-results/gate-2
        env:
          E2E_SKIP_BUILD: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/gate-2
      - name: Gate 3 · product quality (standard) · E2E
        if: ${{ !cancelled() }}
        run: node scripts/quality-gates.mjs run 3 --e2e -- --project=web --project=desktop --output=test-results/gate-3
        env:
          E2E_SKIP_BUILD: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/gate-3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  e2e-electron:
    # The real desktop app (Electron main process, preload, window) driven by Playwright. Windows runners
    # have a desktop session and the OS keychain (DPAPI) the app requires to store its sign-in.
    name: E2E desktop app (Electron, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e --project=electron
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-electron
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
